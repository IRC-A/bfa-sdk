services:
  irc-a-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: irc-a-gateway
    image: sandrog77/irc-a-gateway:latest
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # Enable OpenAI embeddings for semantic FAISS search
      - BFA_USE_MOCK_EMBEDDINGS=false
      - BFA_USE_OPENAI_EMBEDDINGS=true
      - BFA_REGISTRY_DB_PATH=/app/data/bfa_registry_db.json
      - BFA_ENABLE_ACTIVE_PRUNING=false
    volumes:
      # Mounts data directory to persist registered agents and tools across restarts without single-file mount issues
      - ./data:/app/data
      - ./irca_sdk:/app/irca_sdk
      - ./bfa_sdk:/app/bfa_sdk
      - ./poc:/app/poc
    networks:
      - hos_network
      - irca

networks:
  hos_network:
    name: hos_network
    external: true
  irca:
    name: irca
    driver: bridge
    attachable: true
