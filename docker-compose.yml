services:
  irc-a-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: irc-a-gateway
    image: sandrog77/irc-a-gateway:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Enable OpenAI embeddings for semantic FAISS search
      - BFA_USE_MOCK_EMBEDDINGS=false
      - BFA_USE_OPENAI_EMBEDDINGS=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      # Mounts registry database to persist registered agents and tools across restarts
      - ./bfa_registry_db.json:/app/bfa_registry_db.json
    networks:
      - irca

networks:
  irca:
    name: irca
    driver: bridge
    attachable: true
