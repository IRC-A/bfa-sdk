services:
  irc-a-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: irc-a-gateway
    image: sandrog77/irc-a-gateway:latest
    ports:
      - "8000:8000"
    environment:
      # Propagates the host's OpenAI key if available, otherwise falls back to local DummyEmbedder
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BFA_REGISTRY_DB_PATH=/app/data/bfa_registry_db.json
    volumes:
      # Mounts named volume to persist registry database across restarts without host directory issues
      - bfa_data:/app/data

volumes:
  bfa_data:
