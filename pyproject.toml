[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irc-a-sdk"
version = "0.3.0"
description = "Lightweight Python SDK for building autonomous agents (A2A) and FastMCP tool servers following the IRC-A protocol."
readme = "README.md"
authors = [
    { name = "Sandro Garcia" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "starlette",
    "httpx",
    "python-dotenv",
    "a2a-sdk",
    "fastmcp",
    "cryptography"
]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["bfa_sdk*", "irc_a_sdk*"]
