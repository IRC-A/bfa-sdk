<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="240" height="240" fill="none">
  <!-- Sleek premium gradient background -->
  <defs>
    <linearGradient id="bg-grad-epa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D2671" />
      <stop offset="100%" stop-color="#C33764" />
    </linearGradient>
    <linearGradient id="glow-grad-epa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#7F00FF" />
    </linearGradient>
  </defs>

  <!-- Base Circle Node -->
  <rect width="24" height="24" rx="6" fill="url(#bg-grad-epa)" />

  <!-- Outer Network Ring -->
