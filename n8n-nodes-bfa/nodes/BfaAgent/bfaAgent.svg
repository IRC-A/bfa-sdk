<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="240" height="240" fill="none">
  <!-- Sleek premium gradient background -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1C2C" />
      <stop offset="100%" stop-color="#928DAB" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
  </defs>

  <!-- Base Circle Node -->
  <rect width="24" height="24" rx="6" fill="url(#bg-grad)" />

  <!-- Outer Network ring -->
  <circle cx="12" cy="12" r="8" stroke="url(#glow-grad)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 2" />

  <!-- Inner Agent Core symbol -->
  <circle cx="12" cy="12" r="3.5" fill="url(#glow-grad)" opacity="0.85" />
  
  <!-- Relays / Ports -->
  <circle cx="12" cy="4" r="1" fill="#FFFFFF" />
  <circle cx="20" cy="12" r="1" fill="#FFFFFF" />
  <circle cx="12" cy="20" r="1" fill="#FFFFFF" />
  <circle cx="4" cy="12" r="1" fill="#FFFFFF" />
</svg>
